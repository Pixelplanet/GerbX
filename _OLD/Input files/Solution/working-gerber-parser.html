<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Funktionierender Gerber Parser</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #1a1a1a;
            color: #e0e0e0;
            padding: 20px;
        }
        .container { max-width: 1600px; margin: 0 auto; }
        h1 { margin-bottom: 20px; color: #4CAF50; }
        .controls {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        input[type="file"] {
            padding: 10px;
            background: #3a3a3a;
            border: 1px solid #555;
            color: #e0e0e0;
            border-radius: 4px;
            margin-right: 10px;
        }
        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 10px;
        }
        button:hover { background: #45a049; }
        .canvas-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }
        .canvas-box {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 8px;
        }
        .canvas-box h2 {
            color: #4CAF50;
            margin-bottom: 10px;
            font-size: 18px;
        }
        canvas {
            width: 100%;
            background: white;
            border-radius: 4px;
            cursor: crosshair;
        }
        .stats {
            background: #3a3a3a;
            padding: 15px;
            border-radius: 4px;
            margin-top: 10px;
            font-family: monospace;
            font-size: 12px;
        }
        .log {
            background: #1a1a1a;
            padding: 10px;
            border-radius: 4px;
            margin-top: 10px;
            max-height: 200px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 11px;
        }
        .error { color: #ff5555; }
        .success { color: #50fa7b; }
        .warning { color: #f1fa8c; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 Funktionierender Gerber Parser (von Grund auf)</h1>
        
        <div class="controls">
            <input type="file" id="fileInput" accept=".gbr,.ger">
            <button onclick="parseAndRender()">Parse & Render</button>
            <button onclick="invertLayer()">Invertieren</button>
            <button onclick="exportSVG()">Als SVG exportieren</button>
            <button onclick="clearCanvas()">Clear</button>
        </div>

        <div class="canvas-grid">
            <div class="canvas-box">
                <h2>Original Layer</h2>
                <canvas id="originalCanvas" width="800" height="600"></canvas>
                <div class="stats" id="originalStats"></div>
            </div>
            <div class="canvas-box">
                <h2>Invertiert Layer</h2>
                <canvas id="invertedCanvas" width="800" height="600"></canvas>
                <div class="stats" id="invertedStats"></div>
            </div>
        </div>

        <div class="log" id="log"></div>
    </div>

    <script>
        let gerberContent = '';
        let parsedData = null;
        let originalCanvas, invertedCanvas;
        let originalCtx, invertedCtx;

        // Initialize canvases
        window.onload = () => {
            originalCanvas = document.getElementById('originalCanvas');
            invertedCanvas = document.getElementById('invertedCanvas');
            originalCtx = originalCanvas.getContext('2d');
            invertedCtx = invertedCanvas.getContext('2d');
            log('System bereit.', 'success');
        };

        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            const className = type;
            logDiv.innerHTML += `<div class="${className}">[${timestamp}] ${message}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function parseAndRender() {
            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];
            
            if (!file) {
                log('Keine Datei ausgewählt!', 'error');
                return;
            }

            const reader = new FileReader();
            reader.onload = (e) => {
                gerberContent = e.target.result;
                log(`Datei geladen: ${file.name} (${gerberContent.length} bytes)`, 'success');
                
                // Parse
                parsedData = parseGerber(gerberContent);
                log(`Parsing abgeschlossen: ${parsedData.traces.length} Traces, ${parsedData.pads.length} Pads`, 'success');
                
                // Render original
                renderLayer(originalCtx, parsedData, false);
                updateStats('originalStats', parsedData, false);
                
                log('Rendering abgeschlossen', 'success');
            };
            reader.readAsText(file);
        }

        function parseGerber(content) {
            const lines = content.split('\n').map(l => l.trim()).filter(l => l);
            
            const state = {
                apertures: {},
                currentAperture: null,
                currentX: 0,
                currentY: 0,
                format: { intX: 4, decX: 6, intY: 4, decY: 6 },
                unit: 'mm',
                polarity: 'dark',
                interpolation: 'linear'
            };

            const data = {
                traces: [],
                pads: [],
                regions: [],
                bounds: { minX: Infinity, minY: Infinity, maxX: -Infinity, maxY: -Infinity }
            };

            log('Starte Parsing...', 'info');

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i];
                
                // Skip comments
                if (line.startsWith('G04')) continue;

                // Format specification: %FSLAX46Y46*%
                if (line.includes('FSLAX') || line.includes('FSLAY')) {
                    const match = line.match(/FSLAX?(\d)(\d)Y(\d)(\d)/);
                    if (match) {
                        state.format = {
                            intX: parseInt(match[1]),
                            decX: parseInt(match[2]),
                            intY: parseInt(match[3]),
                            decY: parseInt(match[4])
                        };
                        log(`Format: ${match[1]}.${match[2]} / ${match[3]}.${match[4]}`, 'info');
                    }
                }

                // Unit mode
                if (line.includes('%MOMM*%')) state.unit = 'mm';
                if (line.includes('%MOIN*%')) state.unit = 'in';

                // Polarity
                if (line.includes('%LPD*%')) state.polarity = 'dark';
                if (line.includes('%LPC*%')) state.polarity = 'clear';

                // Aperture definition: %ADD10C,0.150000*%
                if (line.match(/%ADD\d+/)) {
                    const aperture = parseApertureDefinition(line);
                    if (aperture) {
                        state.apertures[aperture.id] = aperture;
                    }
                }

                // Aperture selection: D10*
                if (line.match(/^D\d+\*$/)) {
                    state.currentAperture = line.replace('*', '');
                }

                // Coordinate operation
                if (line.match(/[XY]-?\d+/) && line.match(/D0[123]/)) {
                    const cmd = parseCoordinateCommand(line, state);
                    if (cmd) {
                        if (cmd.operation === 'D01') {
                            // Draw line from current position to new position
                            const trace = {
                                x1: state.currentX,
                                y1: state.currentY,
                                x2: cmd.x,
                                y2: cmd.y,
                                aperture: state.currentAperture,
                                width: getApertureWidth(state.apertures[state.currentAperture])
                            };
                            data.traces.push(trace);
                            updateBounds(data.bounds, cmd.x, cmd.y);
                        } else if (cmd.operation === 'D03') {
                            // Flash (pad)
                            const pad = {
                                x: cmd.x,
                                y: cmd.y,
                                aperture: state.currentAperture,
                                size: getApertureWidth(state.apertures[state.currentAperture])
                            };
                            data.pads.push(pad);
                            updateBounds(data.bounds, cmd.x, cmd.y);
                        }
                        
                        // Update current position
                        state.currentX = cmd.x;
                        state.currentY = cmd.y;
                    }
                }
            }

            log(`Bounds: X(${data.bounds.minX.toFixed(2)}, ${data.bounds.maxX.toFixed(2)}) Y(${data.bounds.minY.toFixed(2)}, ${data.bounds.maxY.toFixed(2)})`, 'info');
            
            return data;
        }

        function parseApertureDefinition(line) {
            // %ADD10C,0.150000*%
            const match = line.match(/%ADD(\d+)([CRO])([^*]*)\*%/);
            if (!match) return null;

            const id = 'D' + match[1];
            const type = match[2]; // C=Circle, R=Rectangle, O=Obround
            const params = match[3].split(',').filter(p => p).map(p => parseFloat(p));

            return { id, type, params };
        }

        function parseCoordinateCommand(line, state) {
            let x = state.currentX;
            let y = state.currentY;

            // Extract X coordinate
            const xMatch = line.match(/X(-?\d+)/);
            if (xMatch) {
                x = parseCoordinate(xMatch[1], state.format.decX);
            }

            // Extract Y coordinate
            const yMatch = line.match(/Y(-?\d+)/);
            if (yMatch) {
                y = parseCoordinate(yMatch[1], state.format.decY);
            }

            // Extract operation
            let operation = null;
            if (line.includes('D01')) operation = 'D01'; // Interpolate (draw)
            if (line.includes('D02')) operation = 'D02'; // Move
            if (line.includes('D03')) operation = 'D03'; // Flash

            return operation ? { x, y, operation } : null;
        }

        function parseCoordinate(coordStr, decimals) {
            // Format 4.6: X153230000 -> 153.230000
            const value = parseInt(coordStr);
            const divisor = Math.pow(10, decimals);
            return value / divisor;
        }

        function getApertureWidth(aperture) {
            if (!aperture) return 0.15; // Default
            if (aperture.type === 'C') return aperture.params[0] || 0.15; // Circle diameter
            if (aperture.type === 'R') return Math.max(aperture.params[0] || 0, aperture.params[1] || 0);
            return 0.15;
        }

        function updateBounds(bounds, x, y) {
            bounds.minX = Math.min(bounds.minX, x);
            bounds.maxX = Math.max(bounds.maxX, x);
            bounds.minY = Math.min(bounds.minY, y);
            bounds.maxY = Math.max(bounds.maxY, y);
        }

        function renderLayer(ctx, data, inverted) {
            const canvas = ctx.canvas;
            const width = canvas.width;
            const height = canvas.height;

            // Clear canvas
            ctx.fillStyle = inverted ? '#000' : '#fff';
            ctx.fillRect(0, 0, width, height);

            if (!data || data.traces.length === 0) {
                log('Keine Daten zum Rendern', 'warning');
                return;
            }

            // Calculate transform
            const bounds = data.bounds;
            const pcbWidth = bounds.maxX - bounds.minX;
            const pcbHeight = bounds.maxY - bounds.minY;
            
            const padding = 20;
            const scaleX = (width - 2 * padding) / pcbWidth;
            const scaleY = (height - 2 * padding) / pcbHeight;
            const scale = Math.min(scaleX, scaleY);

            const offsetX = padding - bounds.minX * scale;
            const offsetY = padding - bounds.minY * scale;

            // Helper function to transform coordinates
            const tx = (x) => x * scale + offsetX;
            const ty = (y) => y * scale + offsetY;

            // Render traces
            ctx.strokeStyle = inverted ? '#fff' : '#0a0';
            ctx.lineCap = 'round';
            
            log(`Rendering ${data.traces.length} Traces mit Scale ${scale.toFixed(2)}`, 'info');
            
            data.traces.forEach((trace, idx) => {
                ctx.lineWidth = trace.width * scale;
                ctx.beginPath();
                ctx.moveTo(tx(trace.x1), ty(trace.y1));
                ctx.lineTo(tx(trace.x2), ty(trace.y2));
                ctx.stroke();
                
                if (idx < 5) {
                    log(`Trace ${idx}: (${trace.x1.toFixed(2)}, ${trace.y1.toFixed(2)}) -> (${trace.x2.toFixed(2)}, ${trace.y2.toFixed(2)}) width=${trace.width.toFixed(3)}`, 'info');
                }
            });

            // Render pads
            ctx.fillStyle = inverted ? '#fff' : '#f00';
            data.pads.forEach((pad) => {
                const radius = (pad.size / 2) * scale;
                ctx.beginPath();
                ctx.arc(tx(pad.x), ty(pad.y), radius, 0, 2 * Math.PI);
                ctx.fill();
            });

            log(`Rendering abgeschlossen: ${data.traces.length} traces, ${data.pads.length} pads`, 'success');
        }

        function updateStats(elementId, data, inverted) {
            const statsDiv = document.getElementById(elementId);
            const bounds = data.bounds;
            
            statsDiv.innerHTML = `
                <strong>Statistiken:</strong><br>
                Traces: ${data.traces.length}<br>
                Pads: ${data.pads.length}<br>
                Regions: ${data.regions.length}<br>
                PCB Größe: ${(bounds.maxX - bounds.minX).toFixed(2)} x ${(bounds.maxY - bounds.minY).toFixed(2)} mm<br>
                Invertiert: ${inverted ? 'Ja' : 'Nein'}
            `;
        }

        function invertLayer() {
            if (!parsedData) {
                log('Bitte zuerst eine Datei parsen!', 'error');
                return;
            }

            log('Invertiere Layer...', 'info');
            
            // Render inverted
            renderLayer(invertedCtx, parsedData, true);
            updateStats('invertedStats', parsedData, true);
            
            log('Invertierung abgeschlossen', 'success');
        }

        function exportSVG() {
            if (!parsedData) {
                log('Keine Daten zum Exportieren', 'error');
                return;
            }

            const bounds = parsedData.bounds;
            const width = bounds.maxX - bounds.minX;
            const height = bounds.maxY - bounds.minY;
            const padding = 2;

            let svg = `<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="${width + 2*padding}mm" height="${height + 2*padding}mm" viewBox="${bounds.minX - padding} ${bounds.minY - padding} ${width + 2*padding} ${height + 2*padding}">
`;

            // Add traces
            svg += '  <g id="traces" stroke="#00aa00" stroke-linecap="round" fill="none">\n';
            parsedData.traces.forEach(trace => {
                svg += `    <line x1="${trace.x1}" y1="${trace.y1}" x2="${trace.x2}" y2="${trace.y2}" stroke-width="${trace.width}"/>\n`;
            });
            svg += '  </g>\n';

            // Add pads
            svg += '  <g id="pads" fill="#ff0000">\n';
            parsedData.pads.forEach(pad => {
                svg += `    <circle cx="${pad.x}" cy="${pad.y}" r="${pad.size / 2}"/>\n`;
            });
            svg += '  </g>\n';

            svg += '</svg>';

            // Download
            const blob = new Blob([svg], { type: 'image/svg+xml' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'gerber-export.svg';
            a.click();

            log('SVG exportiert', 'success');
        }

        function clearCanvas() {
            originalCtx.fillStyle = '#fff';
            originalCtx.fillRect(0, 0, originalCanvas.width, originalCanvas.height);
            invertedCtx.fillStyle = '#fff';
            invertedCtx.fillRect(0, 0, invertedCanvas.width, invertedCanvas.height);
            log('Canvas geleert', 'info');
        }
    </script>
</body>
</html>
